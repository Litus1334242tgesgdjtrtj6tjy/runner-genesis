mode: PAPER
live_trading: false
paper_starting_capital_eur: 300.0
currency: EUR

features:
  social_enabled: false
  database_persistence:
    enabled: true
  flywire:
    enabled: true
    artifact_dir: ./artifacts/flywire
    state_dim: 64
    alpha: 0.90
    variant: FLY_REAL
  quantum_graph:
    enabled: false
    max_nodes: 128
  flow_dynamics:
    enabled: true
  jump_sde:
    enabled: true
    state_dim: 32
  hawkes:
    enabled: true
    half_life_seconds: 25.0
  hypergraph:
    enabled: true
  world_model:
    enabled: true
    model_path: ./artifacts/models/world_model.joblib
  genesis_model:
    model_path: ./artifacts/models/genesis_model.joblib

smart_capital:
  enabled: true
  min_wallet_quality: 0.20
  min_strategy_match: 0.35
  min_effective_wallets: 1.25
  min_consensus: 0.55
  min_accumulation: 0.45
  min_conviction: 0.35
  max_entry_distance_price: 1.50
  freshness_half_life_seconds: 900
  quality_sample_target: 30
  state_confirm_threshold: 0.62
  state_persistence_threshold: 0.68
  distribution_protect_threshold: 0.58
  distribution_exit_threshold: 0.76

pump_discovery:
  enabled: true
  top_traders_enabled: true
  kol_enabled: true
  cohort_enabled: true
  max_snapshot_age_seconds: 3600

fomo:
  enabled: true
  minimum_source_confidence: 0.35
  maximum_source_age_seconds: 900
  window_seconds: 300

mirofish:
  enabled: true
  num_rollouts: 128
  horizon_seconds: 900
  random_seed: 20260927
  max_agents: 64
  rollout_timeout_ms: 250
  use_world_model_prior: true
  require_min_data_quality: 0.45
  trigger_min_consensus: 0.25
  trigger_min_accumulation: 0.20
  trigger_min_top_trader_wave: 0.20
  trigger_min_fomo: 0.30

persistence:
  enabled: true

risk:
  max_position_eur: 25.0
  max_account_pct_per_trade: 0.08
  max_simultaneous_positions: 4
  max_daily_loss_eur: 30.0
  max_portfolio_drawdown_pct: 0.20
  max_daily_spend_eur: 120.0
  max_slippage_pct: 0.12
  min_liquidity_usd: 10000.0
  max_dev_holdings_pct: 0.12
  max_sniper_pct: 0.30
  max_bundle_pct: 0.30
  max_suspected_related_concentration_pct: 0.35
  max_correlated_exposure_pct: 0.35
  min_sellability_score: 0.25
  max_manipulation_risk: 0.78
  kill_switch: false

execution:
  latency_ms_mean: 1100
  latency_ms_std: 250
  execution_delay_seconds: 60
  base_fee_bps: 35
  priority_fee_bps: 10
  mev_adverse_bps: 20
  base_slippage_bps: 35
  impact_coefficient: 1.25
  max_liquidity_fraction: 0.02
  failed_tx_base_probability: 0.015
  partial_fill_enabled: true

trader:
  min_genesis_to_watch: 0.55
  min_entry_edge: 0.025
  min_hold_score: 0.52
  reduce_below_hold_score: 0.42
  exit_below_hold_score: 0.28
  moonbag_fraction: 0.15
  max_adds_per_position: 2
  default_position_eur: 10.0
  require_trained_for_entry: true
  allow_untrained_paper_entry: true

point_in_time:
  strict: true

helius_history:
  enabled: true
  page_limit: 100
  max_pages: 5
  min_funding_sol: 0.01
  refresh_seconds: 21600

external_discovery:
  fomoscan_enabled: true
  auto_refresh: true
  refresh_seconds: 300
  max_wallets_per_refresh: 25
