name: Test runner-genesis

on:
  push:
    branches:
      - work/v0.2-smart-capital-world-model
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q
      - name: Backtest smoke
        run: python -m runner_genesis.cli backtest data/demo/demo_events.jsonl
      - name: Ablation smoke
        run: python -m runner_genesis.cli ablation data/demo/demo_events.jsonl > /tmp/ablation.json

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install frontend
        run: npm install
      - name: Build frontend
        run: npm run build
