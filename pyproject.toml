[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runner-genesis-omega"
version = "0.2.0"
description = "Paper-only research lab for early Solana memecoin runner detection"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "websockets>=12",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "PyYAML>=6.0",
  "joblib>=1.3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
runner-genesis = "runner_genesis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runner_genesis*"]
